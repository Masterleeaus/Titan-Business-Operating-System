<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Titan Business Operating System</title><desc id="desc">A violet and gold banner for Titan Business Operating System, a modular Laravel business-platform codebase with shared operational domains, user surfaces, and configurable service-industry overlays.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#211642"/><stop offset="1" stop-color="#44214c"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs><rect width="1200" height="320" rx="24" fill="url(#bg)"/><circle cx="1060" cy="60" r="210" fill="#c084fc" opacity=".10"/><path d="M0 275L210 218l165 29 205-100 190 82 260-125 170 73" fill="none" stroke="#c084fc" stroke-opacity=".18" stroke-width="2"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="64" y="62" fill="#f0abfc" font-size="13" font-weight="700" letter-spacing="3">TITAN BOS � MODULAR LARAVEL PLATFORM � SHARED DOMAINS + OVERLAYS</text><text x="64" y="126" fill="#f8fafc" font-size="43" font-weight="800">Titan Business Operating System</text><text x="64" y="158" fill="#ddd6fe" font-size="16">One application core for owners, dispatch, workers, and customers</text></g><g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><path d="M135 240H1065" stroke="url(#line)" stroke-width="3"/><g fill="#2b1d4d" stroke="#c084fc" stroke-width="2"><circle cx="155" cy="240" r="25"/><circle cx="385" cy="240" r="25"/><circle cx="615" cy="240" r="25"/><circle cx="845" cy="240" r="25"/><circle cx="1065" cy="240" r="25"/></g><g fill="#f8fafc" font-size="12" font-weight="700"><text x="155" y="245">SURFACES</text><text x="385" y="245">MODULES</text><text x="615" y="245">OVERLAYS</text><text x="845" y="245">FILAMENT</text><text x="1065" y="245">PWA</text></g><g fill="#c4b5fd" font-size="11"><text x="155" y="284">owner � dispatch</text><text x="385" y="284">shared domains</text><text x="615" y="284">service workflows</text><text x="845" y="284">admin surfaces</text><text x="1065" y="284">field surfaces</text></g></g></svg>

