<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Titan Business Operating System modular architecture</title><desc id="desc">Architecture map of Titan BOS: owner, dispatch, worker, and customer surfaces connect to shared Laravel modules, configurable vertical overlays, Filament and PWA presentation surfaces, and tests.</desc>
